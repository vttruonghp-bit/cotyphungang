name: Temporary dice formatter
on:
  push:
    branches:
      - feature/realistic-dice-shake-louder
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/realistic-dice-shake-louder
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write client/src/components/dice.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/dice.css
          if ! git diff --cached --quiet; then
            git commit -m "Format dice CSS"
            git push
          fi
