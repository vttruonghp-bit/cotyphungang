name: Temporary movement format
on:
  push:
    branches:
      - feature/dice-roll-custom-audio
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dice-roll-custom-audio
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write client/src/App.tsx client/src/screens/GameScreen.tsx client/src/screens/game-screen.css client/src/components/Board.tsx client/src/components/board.css client/src/components/dice.css client/src/components/Sheet.tsx client/src/components/sheet.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src
          if ! git diff --cached --quiet; then
            git commit -m "Format movement animations"
            git push
          fi
