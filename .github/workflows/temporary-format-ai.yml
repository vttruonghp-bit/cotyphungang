name: Temporary format AI feature
on:
  push:
    branches: [feature-play-vs-ai]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-play-vs-ai
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write client/src/App.tsx client/src/game/aiOpponent.ts client/src/screens/SetupScreen.tsx
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/src
            git commit -m "Format solo AI game feature"
            git push origin HEAD:feature-play-vs-ai
          fi
