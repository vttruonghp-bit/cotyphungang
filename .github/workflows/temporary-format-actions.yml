name: Format avatar cleanup CSS
on:
  push:
    branches:
      - feature-adjacent-actions-token-only
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-adjacent-actions-token-only
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write client/src/screens/game-screen.css
      - name: Push formatted stylesheet
        run: |
          if ! git diff --quiet -- client/src/screens/game-screen.css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/src/screens/game-screen.css
            git commit -m "Format tile action and player icon CSS"
            git push origin HEAD:feature-adjacent-actions-token-only
          fi
