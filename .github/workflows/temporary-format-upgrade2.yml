name: Format upgraded rules
on:
  push:
    branches:
      - feature-upgrade-with-manage-undo
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-upgrade-with-manage-undo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write shared/src/engine/game.ts shared/test/engine/sim.ts
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add shared/src/engine/game.ts shared/test/engine/sim.ts
            git commit -m "Format upgrade liquidation safety checks"
            git push origin HEAD:feature-upgrade-with-manage-undo
          fi
