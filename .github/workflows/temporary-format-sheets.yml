name: Temporary format sheet cleanup
on:
  push:
    branches: [cleanup-all-game-sheet-overlays]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-all-game-sheet-overlays
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write client/src/sheets/manage-sheet.css
      - name: Commit format
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/src/sheets/manage-sheet.css
            git commit -m "Format cleaned sheet CSS"
            git push origin HEAD:cleanup-all-game-sheet-overlays
          fi
