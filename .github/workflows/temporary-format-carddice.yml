name: Temporary card-dice formatter
on:
  push:
    branches: [feature-confirm-card-dice-before-effects]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-confirm-card-dice-before-effects
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write client/src/sheets/CardDiceSheet.tsx client/src/screens/GameScreen.tsx shared/src/engine/game.ts shared/src/engine/landing.ts shared/src/engine/types.ts shared/test/engine/card-dice-confirmation.test.ts
      - name: Commit format
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/src shared/src shared/test
            git commit -m "Format staged card dice implementation"
            git push origin HEAD:feature-confirm-card-dice-before-effects
          fi
