name: Temporary buy controls formatter
on:
  push:
    branches:
      - fix/buy-buttons-inner-board
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/buy-buttons-inner-board
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write client/src/screens/game-screen.css client/src/screens/GameScreen.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/screens/game-screen.css client/src/screens/GameScreen.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format buy controls"
            git push
          fi
