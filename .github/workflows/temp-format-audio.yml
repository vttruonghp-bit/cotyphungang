name: Temporary audio format
on:
  push:
    branches:
      - feature/dice-roll-custom-audio
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dice-roll-custom-audio
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write client/src/audio/gameAudio.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/audio/gameAudio.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format game audio mixer"
            git push
          fi
