name: Format card tests
on:
  push:
    branches: [feature-confirm-card-dice-before-effects]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-confirm-card-dice-before-effects
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write shared/test/engine/card-dice-confirmation.test.ts
      - name: Commit format
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add shared/test/engine/card-dice-confirmation.test.ts
            git commit -m "Format card dice coverage tests"
            git push origin HEAD:feature-confirm-card-dice-before-effects
          fi
